name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

env:
  BUN_VERSION: 1.4.2

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kobralink
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --mac
            bundle_archs: arm64,x64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json apps/desktop/package.json apps/api/package.json; do
            node -e "const fs=require('fs');const p='$f';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,4)+'\n')"
          done

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bunx turbo run build --filter=@kobralink/shared --filter=@kobralink/kobra-protocol --filter=@kobralink/i18n

      - name: Build desktop app
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then unset "$name"; fi
          done
          if [ -n "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=true; fi
          bun run --filter @kobralink/desktop dist -- ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOBRALINK_BUNDLE_ARCHS: ${{ matrix.bundle_archs }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release
    needs: [docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Write release body
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kobralink
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          V="${VERSION#v}"
          PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          RANGE="${VERSION}"
          [ -z "$PREV" ] || RANGE="${PREV}..${VERSION}"
          CHANGES="$(git log "$RANGE" --no-merges --invert-grep --grep='^\[Release\]' --pretty='- %s ([%h](${REPO_URL}/commit/%H))')"
          [ -n "$CHANGES" ] || CHANGES="- No changes recorded."
          cat > body.md <<EOF
          ## Changes

          ${CHANGES}

          ## Desktop app

          | Platform | File |
          |---|---|
          | macOS Apple Silicon | \`Kobralink-${V}-mac-arm64.dmg\` |
          | macOS Intel | \`Kobralink-${V}-mac-x64.dmg\` |
          | Windows | \`Kobralink-${V}-Installer-win-x64.exe\` |
          | Linux | \`Kobralink-${V}-linux-x86_64.AppImage\` / \`Kobralink-${V}-linux-amd64.deb\` |

          macOS: the app is not notarized — right-click → Open on first launch, or \`xattr -dr com.apple.quarantine /Applications/Kobralink.app\`.

          ## Web server (no desktop app)

          Kobralink also runs headless as a Docker container: the same dashboard is served at \`http://<host>:7100\` and the Moonraker endpoints on \`7125+\`.

          \`\`\`bash
          docker pull ${IMAGE}:${V}
          \`\`\`

          With docker compose (no clone needed, \`infra/docker-compose.prod.yml\` uses the Docker Hub image):

          \`\`\`bash
          mkdir kobralink && cd kobralink
          curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/infra/docker-compose.prod.yml
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/infra/.env.example -o .env
          # set BETTER_AUTH_URL to the URL your browser uses, and KOBRALINK_IMAGE=${IMAGE}:${V} to pin this version
          docker compose -f docker-compose.prod.yml up -d
          \`\`\`

          Image tags: \`${IMAGE}:${V}\`, \`${IMAGE}:latest\` (linux/amd64, linux/arm64). See \`infra/README.md\` for updates, backups and reverse proxy.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kobralink ${{ github.ref_name }}
          body_path: body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
