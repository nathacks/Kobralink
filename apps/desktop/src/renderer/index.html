<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Kobralink</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <div class="drag"></div>
    <main id="app">
      <h1>Kobralink</h1>
      <p id="message" data-i18n="desktop_starting_short">Démarrage du bridge…</p>
      <form id="settings" hidden>
        <label><input type="radio" name="mode" value="local" /> <span data-i18n="desktop_local_bridge">Bridge local (sur ce Mac)</span></label>
        <label class="row"><span data-i18n="desktop_port">Port</span> <input id="localPort" type="number" min="1024" max="65535" /></label>
        <label><input type="radio" name="mode" value="remote" /> <span data-i18n="desktop_remote_bridge">Bridge distant</span></label>
        <label class="row"><span data-i18n="desktop_url">URL</span> <input id="remoteUrl" type="url" placeholder="http://192.168.1.50:7100" /></label>
        <div class="actions">
          <button type="submit" data-i18n="desktop_connect">Se connecter</button>
        </div>
      </form>
      <div id="error-actions" hidden>
        <button type="button" id="retry" data-i18n="desktop_retry">Réessayer</button>
        <button type="button" id="open-settings" class="secondary" data-i18n="desktop_change_bridge">Changer de bridge</button>
      </div>
    </main>
    <script type="module" src="./launcher.ts"></script>
  </body>
</html>
