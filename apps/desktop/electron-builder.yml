appId: dev.kobralink.desktop
productName: Kobralink
executableName: kobralink
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
extraResources:
  - from: ../api/bundle
    to: api
  - from: ../api/bundle/node_modules
    to: api/node_modules
  - from: ../web/dist
    to: web
publish:
  provider: github
  owner: nathacks
  repo: Kobralink
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  desktop:
    entry:
      Name: Kobralink
      StartupWMClass: kobralink
  target: [AppImage, deb]
  maintainer: NatHacks
