appId: dev.kobralink.desktop
productName: Kobralink
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
afterSign: scripts/after-sign.cjs
files:
  - out/**
  - resources/**
extraResources:
  - from: ../api/bundle
    to: api
  - from: ../api/bundle/node_modules
    to: api/node_modules
  - from: ../web/dist
    to: web
publish:
  provider: github
  owner: nathacks
  repo: Kobralink
mac:
  icon: build/icon-mac.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  background: build/background.png
  icon: build/dmg-icon.png
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 175
      type: file
    - x: 400
      y: 175
      type: link
      path: /Applications
win:
  artifactName: ${productName}-${version}-Installer-win-${arch}.${ext}
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
linux:
  executableName: kobralink
  category: Utility
  desktop:
    entry:
      Name: Kobralink
      StartupWMClass: kobralink
  target: [AppImage, deb]
  maintainer: NatHacks
