    to: api
  - from: ../api/bundle/node_modules
    to: api/node_modules
  - from: ../web/dist
    to: web
publish:
  provider: github
  owner: nathacks
  repo: Kobralink
mac:
  category: public.app-category.utilities
  target: [dmg, zip]
  darkModeSupport: true
