name: kobralink

services:
  kobralink:
    image: ${KOBRALINK_IMAGE:-ghcr.io/nathacks/kobralink:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kobralink
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      KOBRALINK_DATA_DIR: /data
      KOBRALINK_PORT: 7100
    ports:
      - "${KOBRALINK_BIND:-0.0.0.0}:${KOBRALINK_PORT:-7100}:7100"
      - "${KOBRALINK_BIND:-0.0.0.0}:7125-7140:7125-7140"
    volumes:
      - kobralink-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:7100/api/auth/ok').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s

volumes:
  kobralink-data:
